id: browser
name: 浏览器自动化
version: "1.0.0"
description: 封装 agent-browser CLI 控制本地或远程 CDP Chrome，支持网页交互、表单操作与截图视觉输入。
author: tentacle
entrypoint: plugin.py:setup
permissions:
  - tools:register
  - fs:workspace_write
  - network:outbound
config_schema:
  executable:
    type: string
    label: agent-browser 路径
    default: ""
    help: 留空自动探测（PATH > ~/.local/bin > ~/.npm-global/bin）。
  cdp_discovery_url:
    type: string
    label: 远程 CDP 发现地址
    default: ""
    help: 远程模式填写 http(s)://HOST:PORT/json/version；留空使用本地 Chrome。
  cdp_discovery_timeout:
    type: number
    label: CDP 发现超时（秒）
    default: 8
    minimum: 0.5
    maximum: 120
  chrome_path:
    type: string
    label: Chrome 可执行路径
    default: "~/.local/share/agent-browser/chrome-linux64/chrome"
    help: 仅本地模式生效；留空自动探测。
  skills_dir:
    type: string
    label: agent-browser skills 目录
    default: ""
    help: 留空优先读取 AGENT_BROWSER_SKILLS_DIR 或默认目录。
  session:
    type: string
    label: 浏览器会话名
    default: "tentacle"
    required: true
  headed:
    type: boolean
    label: 有头模式
    default: true
    help: 仅本地模式生效：开启后显示可见浏览器窗口。
  profile:
    type: string
    label: 持久化 Profile 目录
    default: "~/.local/share/agent-browser/tentacle-profile"
    help: 仅本地模式生效：保留登录态；留空则不持久化。
  max_output:
    type: integer
    label: 最大输出字符数
    default: 15000
    minimum: 500
    maximum: 100000
  allow_eval:
    type: boolean
    label: 允许页面 JS（eval）
    default: false
    help: 默认禁用 eval 子命令，开启需注意页面脚本风险。
  allowed_domains:
    type: string_list
    label: 允许访问域名列表
    default: []
    help: 留空表示不限制，每行填写一个域名。
  args:
    type: string_list
    label: Chrome 启动参数
    default:
      - "--no-sandbox"
    help: 仅本地模式生效，每行填写一个启动参数。
  timeout:
    type: number
    label: 单条命令超时（秒）
    default: 60
    minimum: 1
    maximum: 600
