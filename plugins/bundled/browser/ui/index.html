<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浏览器视口</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--t-bg, #181614);
      color: var(--t-fg, #ede8e0);
      font-family: var(--t-font-sans, system-ui, -apple-system, sans-serif);
      font-size: 13px;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* 顶部浏览器控制栏 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--t-bg-surface, #211e1b);
      border-bottom: 1px solid var(--t-border-soft, rgba(255, 255, 255, 0.08));
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .nav-group, .action-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--t-border, rgba(255, 255, 255, 0.12));
      background: var(--t-bg-elevated, #2a2622);
      color: var(--t-fg, #ede8e0);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--t-bg-hover, rgba(255, 255, 255, 0.08));
      border-color: var(--t-border-strong, rgba(255, 255, 255, 0.2));
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 30px;
      padding: 0;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--t-accent, #c97a4a);
      border-color: transparent;
      color: var(--t-accent-fg, #fff);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--t-accent-hover, #b5683a);
      border-color: transparent;
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--t-fg-dim, #a8a096);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--t-bg-hover, rgba(255, 255, 255, 0.07));
      color: var(--t-fg, #ede8e0);
    }

    .btn-active {
      background: var(--t-ok-soft, rgba(52, 211, 153, 0.14));
      border-color: var(--t-ok, #34d399);
      color: var(--t-ok, #34d399);
    }

    .btn-danger-soft {
      background: var(--t-danger-soft, rgba(248, 113, 113, 0.14));
      border-color: transparent;
      color: var(--t-danger, #f87171);
    }

    .btn-danger-soft:hover:not(:disabled) {
      border-color: var(--t-danger, #f87171);
      background: var(--t-danger-soft, rgba(248, 113, 113, 0.22));
    }

    .url-form {
      flex: 1 1 220px;
      min-width: 160px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .status-dot {
      position: absolute;
      left: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--t-fg-faint, #6d665e);
      pointer-events: none;
    }

    .status-dot.connected {
      background: var(--t-ok, #34d399);
      box-shadow: 0 0 0 3px var(--t-ok-soft, rgba(52, 211, 153, 0.2));
    }

    .status-dot.connecting {
      background: var(--t-warn, #f59e0b);
    }

    .url-input {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 26px;
      border-radius: 8px;
      border: 1px solid var(--t-border, rgba(255, 255, 255, 0.12));
      background: var(--t-bg-input, #161412);
      color: var(--t-fg, #ede8e0);
      font-family: var(--t-font-mono, ui-monospace, monospace);
      font-size: 12px;
      outline: none;
    }

    .url-input:focus {
      border-color: var(--t-accent, #c97a4a);
    }

    /* 标签页条 */
    .tabs-bar {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: var(--t-bg-surface, #211e1b);
      border-bottom: 1px solid var(--t-border-soft, rgba(255, 255, 255, 0.08));
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tabs-bar.visible {
      display: flex;
    }

    .tab-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 210px;
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--t-fg-dim, #a8a096);
      font-size: 11.5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-item:hover {
      background: var(--t-bg-hover, rgba(255, 255, 255, 0.06));
      color: var(--t-fg, #ede8e0);
    }

    .tab-item.active {
      background: var(--t-bg-elevated, #2a2622);
      border-color: var(--t-border, rgba(255, 255, 255, 0.12));
      color: var(--t-fg, #ede8e0);
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      border: 0;
      background: transparent;
      color: var(--t-fg-faint, #7a736a);
      cursor: pointer;
      padding: 0 2px;
      font-size: 13px;
      line-height: 1;
      border-radius: 4px;
    }

    .tab-close:hover {
      color: var(--t-danger, #f87171);
      background: var(--t-danger-soft, rgba(248, 113, 113, 0.14));
    }

    /* 主视口区域 */
    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--t-bg, #181614);
      overflow: hidden;
      user-select: none;
    }

    .stage.scroll-mode {
      overflow: auto;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .viewport-shell {
      position: relative;
      display: none;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--t-border, rgba(255, 255, 255, 0.12));
      background: #0d0c0b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .stage.scroll-mode .viewport-shell {
      max-width: none;
      max-height: none;
      margin: auto;
      flex-shrink: 0;
    }

    .viewport-shell.visible {
      display: flex;
    }

    .viewport-shell.focused {
      border-color: var(--t-accent, #c97a4a);
      box-shadow: 0 0 0 2px var(--t-accent-soft, rgba(201, 122, 74, 0.24)), 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    #viewport-canvas {
      display: block;
      touch-action: auto;
      cursor: default;
    }

    #viewport-canvas.interactive {
      touch-action: none;
      cursor: crosshair;
    }

    /* 隐藏 IME 输入捕获代理 */
    #ime-proxy {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      resize: none;
      pointer-events: none;
    }

    /* 空状态/未连接引导卡片 */
    .empty-card {
      width: min(460px, 100%);
      padding: 24px 22px;
      border-radius: 14px;
      border: 1px solid var(--t-border, rgba(255, 255, 255, 0.1));
      background: var(--t-bg-surface, #211e1b);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-card.hidden {
      display: none;
    }

    .empty-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--t-fg, #ede8e0);
    }

    .empty-desc {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--t-fg-dim, #a8a096);
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--t-bg-elevated, #2a2622);
      border: 1px solid var(--t-border-soft, rgba(255, 255, 255, 0.08));
      color: var(--t-fg-dim, #a8a096);
      font-size: 11.5px;
      font-family: var(--t-font-mono, ui-monospace, monospace);
    }

    .error-banner {
      display: none;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--t-danger-soft, rgba(248, 113, 113, 0.14));
      border: 1px solid var(--t-danger, #f87171);
      color: var(--t-danger, #f87171);
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
      word-break: break-word;
    }

    .error-banner.visible {
      display: block;
    }

    .empty-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    /* 快捷文本输入浮条 */
    .text-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--t-bg-surface, #211e1b);
      border-top: 1px solid var(--t-border-soft, rgba(255, 255, 255, 0.08));
      flex-shrink: 0;
    }

    .text-bar.visible {
      display: flex;
    }

    .text-bar input {
      flex: 1;
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--t-border, rgba(255, 255, 255, 0.12));
      background: var(--t-bg-input, #161412);
      color: var(--t-fg, #ede8e0);
      font-size: 12px;
      outline: none;
    }

    .text-bar input:focus {
      border-color: var(--t-accent, #c97a4a);
    }

    /* 底部状态栏 */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 10px;
      background: var(--t-bg-surface, #211e1b);
      border-top: 1px solid var(--t-border-soft, rgba(255, 255, 255, 0.08));
      color: var(--t-fg-dim, #a8a096);
      font-size: 11.5px;
      flex-shrink: 0;
    }

    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mono {
      font-family: var(--t-font-mono, ui-monospace, monospace);
    }

    .status-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--t-fg-dim, #a8a096);
      font-size: 11.5px;
      cursor: pointer;
    }

    .status-btn:hover:not(:disabled) {
      color: var(--t-fg, #ede8e0);
      background: var(--t-bg-hover, rgba(255, 255, 255, 0.08));
      border-color: var(--t-border-soft, rgba(255, 255, 255, 0.1));
    }

    .status-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .waiting-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 12.5px;
      pointer-events: none;
    }

    .waiting-overlay.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="nav-group">
        <button id="btn-back" class="btn btn-icon" type="button" title="后退">←</button>
        <button id="btn-forward" class="btn btn-icon" type="button" title="前进">→</button>
        <button id="btn-reload" class="btn btn-icon" type="button" title="刷新页面">↻</button>
      </div>

      <form id="url-form" class="url-form">
        <span id="status-dot" class="status-dot" title="连接状态"></span>
        <input
          id="url-input"
          class="url-input"
          type="text"
          placeholder="输入网址后回车跳转（例如 https://example.com）"
          autocomplete="off"
          spellcheck="false"
        />
      </form>

      <div class="action-group">
        <button id="btn-connect" class="btn btn-primary" type="button">连接视口</button>
        <button id="btn-interactive" class="btn btn-active" type="button" title="开启或暂停鼠标键盘转发">交互已开启</button>
        <button id="btn-textbar" class="btn btn-ghost" type="button" title="快捷输入或粘贴文本">输入文本</button>
        <button id="btn-back-chat" class="btn" type="button" title="切回主对话页面">回到会话</button>
      </div>
    </header>

    <div id="tabs-bar" class="tabs-bar"></div>

    <main id="stage" class="stage">
      <div id="empty-card" class="empty-card">
        <h2 class="empty-title">浏览器实时视口</h2>
        <p class="empty-desc">
          连接后可直接查看当前浏览器画面，并通过鼠标点击、拖动、滚轮与键盘（支持中文输入）进行人工操作。
        </p>
        <div class="meta-pills">
          <span id="pill-mode" class="pill">模式：读取中…</span>
          <span id="pill-session" class="pill">会话：-</span>
        </div>
        <div id="empty-error" class="error-banner"></div>
        <div class="empty-actions">
          <button id="btn-empty-connect" class="btn btn-primary" type="button">连接实时视口</button>
          <button id="btn-empty-chat" class="btn" type="button">回到会话</button>
        </div>
      </div>

      <div id="viewport-shell" class="viewport-shell">
        <canvas id="viewport-canvas" width="1280" height="720"></canvas>
        <div id="waiting-overlay" class="waiting-overlay">已连接实时流，等待浏览器画面帧…</div>
      </div>

      <textarea
        id="ime-proxy"
        aria-hidden="true"
        autocapitalize="off"
        autocorrect="off"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
    </main>

    <form id="text-bar" class="text-bar">
      <input
        id="text-bar-input"
        type="text"
        placeholder="输入或粘贴文本，回车直接发送到当前浏览器焦点输入框"
        autocomplete="off"
      />
      <button class="btn btn-primary" type="submit">发送</button>
      <button id="btn-textbar-close" class="btn btn-ghost" type="button">收起</button>
    </form>

    <footer class="statusbar">
      <div class="status-left">
        <span id="status-text">未连接</span>
        <span id="status-hint">点击画面后可直接鼠标交互并输入键盘/中文</span>
      </div>
      <div class="status-right mono">
        <button
          id="btn-view-mode"
          class="status-btn"
          type="button"
          title="在适应窗口与 100% 原始尺寸（可滚动）之间切换"
        >适应窗口</button>
        <button
          id="status-size"
          class="status-btn mono"
          type="button"
          title="若远程浏览器窗口大小发生变化，点击重新同步视口分辨率"
        >1280 × 720 ↻</button>
        <span id="status-fps">0 fps</span>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      var api = window.tentacle;
      var stageEl = document.getElementById("stage");
      var canvas = document.getElementById("viewport-canvas");
      var ctx2d = canvas.getContext("2d");
      var viewportShell = document.getElementById("viewport-shell");
      var waitingOverlay = document.getElementById("waiting-overlay");
      var emptyCard = document.getElementById("empty-card");
      var emptyError = document.getElementById("empty-error");
      var pillMode = document.getElementById("pill-mode");
      var pillSession = document.getElementById("pill-session");
      var statusDot = document.getElementById("status-dot");
      var statusText = document.getElementById("status-text");
      var statusHint = document.getElementById("status-hint");
      var btnViewMode = document.getElementById("btn-view-mode");
      var statusSize = document.getElementById("status-size");
      var statusFps = document.getElementById("status-fps");
      var urlForm = document.getElementById("url-form");
      var urlInput = document.getElementById("url-input");
      var tabsBar = document.getElementById("tabs-bar");
      var imeProxy = document.getElementById("ime-proxy");
      var textBar = document.getElementById("text-bar");
      var textBarInput = document.getElementById("text-bar-input");

      var btnBack = document.getElementById("btn-back");
      var btnForward = document.getElementById("btn-forward");
      var btnReload = document.getElementById("btn-reload");
      var btnConnect = document.getElementById("btn-connect");
      var btnEmptyConnect = document.getElementById("btn-empty-connect");
      var btnInteractive = document.getElementById("btn-interactive");
      var btnTextbar = document.getElementById("btn-textbar");
      var btnTextbarClose = document.getElementById("btn-textbar-close");
      var btnBackChat = document.getElementById("btn-back-chat");
      var btnEmptyChat = document.getElementById("btn-empty-chat");

      var state = {
        connected: false,
        connecting: false,
        interactive: true,
        hasFrame: false,
        viewportWidth: 1280,
        viewportHeight: 720,
        offsetTop: 0,
        viewMode: "fit",
        url: "",
        title: "",
        tabs: [],
        mode: "local",
        headed: false,
        session: "",
        error: null,
        keyboardFocused: false
      };

      var frameImage = new Image();
      var renderingFrame = false;
      var queuedFrameData = null;
      var fpsTimestamps = [];
      var heartbeatTimer = null;

      // 鼠标拖动批处理队列
      var pendingInputs = [];
      var flushTimer = null;
      var flushing = false;
      var pointerDown = false;
      var activeButton = "none";
      var lastMoveSentAt = 0;
      var lastDragPointAt = 0;
      var isComposing = false;

      function formatModeLabel(mode, headed) {
        if (mode === "remote") return "远程 CDP";
        return headed ? "本地有头" : "本地无头";
      }

      function fitCanvasToStage() {
        if (!stageEl || !state.connected) return;
        var isActual = state.viewMode === "actual";
        stageEl.classList.toggle("scroll-mode", isActual);
        var frameW = canvas.width || state.viewportWidth || 1280;
        var frameH = canvas.height || state.viewportHeight || 720;
        if (frameW <= 0 || frameH <= 0) return;
        if (isActual) {
          var targetW = state.viewportWidth || frameW;
          var targetH = state.viewportHeight || frameH;
          canvas.style.width = Math.max(1, Math.round(targetW)) + "px";
          canvas.style.height = Math.max(1, Math.round(targetH)) + "px";
          return;
        }
        var availW = Math.max(1, stageEl.clientWidth - 26);
        var availH = Math.max(1, stageEl.clientHeight - 26);
        var scale = Math.min(availW / frameW, availH / frameH);
        var displayW = Math.max(1, Math.floor(frameW * scale));
        var displayH = Math.max(1, Math.floor(frameH * scale));
        canvas.style.width = displayW + "px";
        canvas.style.height = displayH + "px";
      }

      function renderUiState() {
        pillMode.textContent = "模式：" + formatModeLabel(state.mode, state.headed);
        pillSession.textContent = "会话：" + (state.session || "tentacle");

        statusDot.className = "status-dot" + (
          state.connecting ? " connecting" : (state.connected ? " connected" : "")
        );

        btnConnect.disabled = state.connecting;
        btnEmptyConnect.disabled = state.connecting;
        if (state.connecting) {
          btnConnect.textContent = "连接中…";
          btnConnect.className = "btn";
          btnEmptyConnect.textContent = "连接中…";
        } else if (state.connected) {
          btnConnect.textContent = "断开";
          btnConnect.className = "btn btn-danger-soft";
          btnEmptyConnect.textContent = "连接实时视口";
        } else {
          btnConnect.textContent = "连接视口";
          btnConnect.className = "btn btn-primary";
          btnEmptyConnect.textContent = "连接实时视口";
        }

        if (state.interactive) {
          btnInteractive.textContent = "交互已开启";
          btnInteractive.className = "btn btn-active";
          canvas.classList.add("interactive");
        } else {
          btnInteractive.textContent = "仅观看";
          btnInteractive.className = "btn";
          canvas.classList.remove("interactive");
        }

        if (state.connected) {
          emptyCard.classList.add("hidden");
          viewportShell.classList.add("visible");
          waitingOverlay.classList.toggle("visible", !state.hasFrame);
          statusText.textContent = "实时流已连接";
          statusHint.textContent = state.interactive
            ? (state.keyboardFocused ? "键盘焦点已激活（支持直接打字与中文输入）" : "点击画面即可鼠标操作与键盘输入")
            : "当前为仅观看模式，不会转发点击或按键";
        } else {
          stageEl.classList.remove("scroll-mode");
          viewportShell.classList.remove("visible");
          emptyCard.classList.remove("hidden");
          statusText.textContent = state.connecting ? "正在连接实时流…" : "未连接";
          statusHint.textContent = "点击“连接视口”按需开启实时画面";
          statusFps.textContent = "0 fps";
        }

        viewportShell.classList.toggle("focused", state.connected && state.interactive && state.keyboardFocused);
        btnViewMode.textContent = state.viewMode === "actual" ? "100% 原尺寸" : "适应窗口";
        btnViewMode.disabled = !state.connected;
        statusSize.textContent = state.viewportWidth + " × " + state.viewportHeight + " ↻";
        statusSize.disabled = !state.connected;

        if (state.error && !state.connected) {
          emptyError.textContent = state.error;
          emptyError.classList.add("visible");
        } else {
          emptyError.textContent = "";
          emptyError.classList.remove("visible");
        }

        if (document.activeElement !== urlInput && state.url) {
          urlInput.value = state.url;
        }

        renderTabs();
        if (state.connected) {
          requestAnimationFrame(fitCanvasToStage);
        }
      }

      function renderTabs() {
        var tabs = Array.isArray(state.tabs) ? state.tabs : [];
        tabsBar.innerHTML = "";
        if (!tabs.length && !state.connected) {
          tabsBar.classList.remove("visible");
          return;
        }
        tabsBar.classList.add("visible");
        for (var i = 0; i < tabs.length; i++) {
          (function (tab, pos) {
            var ref = tab.tab_id || tab.label || "";
            var tabPayload = ref ? { tab_id: ref } : { index: tab.index };

            var item = document.createElement("div");
            item.className = "tab-item" + (tab.active ? " active" : "");
            item.title = (tab.title || "未命名标签页")
              + (ref ? " (" + ref + ")" : "")
              + (tab.url ? "\n" + tab.url : "");

            var titleSpan = document.createElement("span");
            titleSpan.className = "tab-title";
            titleSpan.textContent = tab.title || tab.url || (ref ? "标签页 " + ref : "标签页 " + (pos + 1));
            item.appendChild(titleSpan);

            if (tabs.length > 1) {
              var closeBtn = document.createElement("button");
              closeBtn.type = "button";
              closeBtn.className = "tab-close";
              closeBtn.textContent = "×";
              closeBtn.title = "关闭标签页";
              closeBtn.addEventListener("click", function (ev) {
                ev.stopPropagation();
                runAction("tab_close", tabPayload);
              });
              item.appendChild(closeBtn);
            }

            item.addEventListener("click", function () {
              if (!tab.active) {
                runAction("tab_select", tabPayload);
              }
            });
            tabsBar.appendChild(item);
          })(tabs[i], i);
        }

        var newBtn = document.createElement("button");
        newBtn.type = "button";
        newBtn.className = "btn btn-ghost";
        newBtn.style.height = "26px";
        newBtn.style.padding = "0 8px";
        newBtn.textContent = "+ 新标签";
        newBtn.addEventListener("click", function () {
          runAction("tab_new", {});
        });
        tabsBar.appendChild(newBtn);
      }

      function applySnapshot(snap) {
        if (!snap || typeof snap !== "object") return;
        if (typeof snap.connected === "boolean") state.connected = snap.connected;
        if (typeof snap.mode === "string") state.mode = snap.mode;
        if (typeof snap.headed === "boolean") state.headed = snap.headed;
        if (typeof snap.session === "string") state.session = snap.session;
        if (typeof snap.url === "string") state.url = snap.url;
        if (typeof snap.title === "string") state.title = snap.title;
        if (Array.isArray(snap.tabs)) state.tabs = snap.tabs;
        if (snap.viewport && snap.viewport.width && snap.viewport.height) {
          state.viewportWidth = snap.viewport.width;
          state.viewportHeight = snap.viewport.height;
        }
        if ("error" in snap) {
          state.error = snap.error || null;
        }
        if (snap.frame && snap.frame.data) {
          drawFramePayload(snap.frame);
        }
        syncHeartbeatTimer();
        renderUiState();
      }

      function drawFramePayload(frame) {
        if (!frame || !frame.data) return;
        var meta = frame.metadata || {};
        if (meta.deviceWidth && meta.deviceHeight) {
          state.viewportWidth = Number(meta.deviceWidth) || state.viewportWidth;
          state.viewportHeight = Number(meta.deviceHeight) || state.viewportHeight;
          statusSize.textContent = state.viewportWidth + " × " + state.viewportHeight + " ↻";
        }
        if (typeof meta.offsetTop === "number" && isFinite(meta.offsetTop)) {
          state.offsetTop = Math.max(0, meta.offsetTop);
        }
        queuedFrameData = frame.data;
        if (!renderingFrame) {
          pumpNextFrame();
        }
      }

      function pumpNextFrame() {
        if (!queuedFrameData) {
          renderingFrame = false;
          return;
        }
        renderingFrame = true;
        var b64 = queuedFrameData;
        queuedFrameData = null;

        frameImage.onload = function () {
          var w = frameImage.naturalWidth || state.viewportWidth;
          var h = frameImage.naturalHeight || state.viewportHeight;
          var resized = (canvas.width !== w || canvas.height !== h);
          if (resized) {
            canvas.width = w;
            canvas.height = h;
          }
          ctx2d.drawImage(frameImage, 0, 0, w, h);
          if (!state.hasFrame) {
            state.hasFrame = true;
            waitingOverlay.classList.remove("visible");
            fitCanvasToStage();
          } else if (resized) {
            fitCanvasToStage();
          }
          var now = performance.now();
          fpsTimestamps.push(now);
          while (fpsTimestamps.length && now - fpsTimestamps[0] > 1000) {
            fpsTimestamps.shift();
          }
          statusFps.textContent = fpsTimestamps.length + " fps";
          pumpNextFrame();
        };
        frameImage.onerror = function () {
          pumpNextFrame();
        };
        frameImage.src = "data:image/jpeg;base64," + b64;
      }

      function syncHeartbeatTimer() {
        if (state.connected) {
          if (!heartbeatTimer) {
            heartbeatTimer = setInterval(function () {
              if (!state.connected || document.visibilityState !== "visible") return;
              api.fetch("/stream/heartbeat", { method: "POST" }).catch(function () {});
            }, 15000);
          }
        } else if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
      }

      function extractError(res, fallback) {
        if (res && res.data && typeof res.data === "object") {
          if (typeof res.data.detail === "string" && res.data.detail) return res.data.detail;
          if (typeof res.data.error === "string" && res.data.error) return res.data.error;
        }
        if (res && typeof res.text === "string" && res.text.trim()) return res.text.trim();
        return fallback || "请求失败";
      }

      function connectStream() {
        if (state.connecting) return;
        state.connecting = true;
        state.error = null;
        renderUiState();
        api.fetch("/stream/connect", {
          method: "POST",
          body: { max_fps: 10 }
        }).then(function (res) {
          state.connecting = false;
          if (!res.ok) {
            state.connected = false;
            state.error = extractError(res, "无法连接实时视口");
            api.toast(state.error, "error");
            renderUiState();
            return;
          }
          state.hasFrame = false;
          applySnapshot(res.data);
          api.toast("浏览器实时视口已连接", "ok");
        }).catch(function (err) {
          state.connecting = false;
          state.connected = false;
          state.error = err && err.message ? err.message : "连接失败";
          api.toast(state.error, "error");
          renderUiState();
        });
      }

      function disconnectStream() {
        state.connecting = false;
        api.fetch("/stream/disconnect", {
          method: "POST",
          body: { disable_daemon_stream: true }
        }).then(function (res) {
          state.connected = false;
          state.hasFrame = false;
          if (res.ok && res.data) {
            applySnapshot(res.data);
          } else {
            syncHeartbeatTimer();
            renderUiState();
          }
          api.toast("已断开浏览器实时视口", "info");
        }).catch(function () {
          state.connected = false;
          state.hasFrame = false;
          syncHeartbeatTimer();
          renderUiState();
        });
      }

      function runAction(action, extra) {
        var payload = Object.assign({ action: action }, extra || {});
        return api.fetch("/action", {
          method: "POST",
          body: payload
        }).then(function (res) {
          if (!res.ok) {
            var msg = extractError(res, "浏览器操作失败");
            api.toast(msg, "error");
            return false;
          }
          applySnapshot(res.data);
          return true;
        }).catch(function (err) {
          api.toast(err && err.message ? err.message : "浏览器操作失败", "error");
          return false;
        });
      }

      function mapPointerCoords(ev) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return { x: 0, y: 0 };
        var nx = (ev.clientX - rect.left) / rect.width;
        var ny = (ev.clientY - rect.top) / rect.height;
        nx = Math.max(0, Math.min(1, nx));
        ny = Math.max(0, Math.min(1, ny));
        return {
          x: Math.round(nx * state.viewportWidth * 100) / 100,
          y: Math.round((ny * state.viewportHeight + (state.offsetTop || 0)) * 100) / 100
        };
      }

      function modifierMask(ev) {
        return (ev.altKey ? 1 : 0) | (ev.ctrlKey ? 2 : 0) | (ev.metaKey ? 4 : 0) | (ev.shiftKey ? 8 : 0);
      }

      function mouseButtonName(btn) {
        if (btn === 0) return "left";
        if (btn === 1) return "middle";
        if (btn === 2) return "right";
        return "none";
      }

      function enqueueInput(eventObj, immediate) {
        if (!state.connected || !state.interactive) return;
        pendingInputs.push(eventObj);
        if (pendingInputs.length >= 24 || immediate) {
          flushInputs();
        } else if (!flushTimer) {
          flushTimer = setTimeout(flushInputs, 32);
        }
      }

      function flushInputs() {
        if (flushTimer) {
          clearTimeout(flushTimer);
          flushTimer = null;
        }
        if (flushing || !pendingInputs.length || !state.connected) return;
        var batch = pendingInputs.splice(0, 48);
        flushing = true;
        api.fetch("/input", {
          method: "POST",
          body: { events: batch }
        }).then(function (res) {
          flushing = false;
          if (!res.ok && res.status === 409) {
            state.connected = false;
            renderUiState();
            return;
          }
          if (pendingInputs.length) {
            flushInputs();
          }
        }).catch(function () {
          flushing = false;
        });
      }

      function focusKeyboardProxy() {
        try {
          imeProxy.focus({ preventScroll: true });
        } catch (_e) {
          imeProxy.focus();
        }
      }

      // 鼠标/指针事件绑定
      canvas.addEventListener("pointerdown", function (ev) {
        if (!state.connected || !state.interactive) return;
        ev.preventDefault();
        focusKeyboardProxy();
        var pos = mapPointerCoords(ev);
        activeButton = mouseButtonName(ev.button);
        pointerDown = true;
        lastDragPointAt = performance.now();
        try { canvas.setPointerCapture(ev.pointerId); } catch (_e) {}
        enqueueInput({
          type: "input_mouse",
          eventType: "mousePressed",
          x: pos.x,
          y: pos.y,
          button: activeButton,
          clickCount: Math.max(1, Math.min(3, ev.detail || 1)),
          modifiers: modifierMask(ev)
        }, true);
      });

      canvas.addEventListener("pointermove", function (ev) {
        if (!state.connected || !state.interactive) return;
        var now = performance.now();
        var minGap = pointerDown ? 20 : 80;
        if (now - lastMoveSentAt < minGap) return;
        lastMoveSentAt = now;
        var pos = mapPointerCoords(ev);
        var delayMs = pointerDown ? Math.min(60, Math.max(0, Math.round(now - lastDragPointAt))) : 0;
        lastDragPointAt = now;
        enqueueInput({
          type: "input_mouse",
          eventType: "mouseMoved",
          x: pos.x,
          y: pos.y,
          button: pointerDown ? activeButton : "none",
          modifiers: modifierMask(ev),
          delayMs: delayMs
        }, false);
      });

      function finishPointer(ev) {
        if (!pointerDown) return;
        pointerDown = false;
        try { canvas.releasePointerCapture(ev.pointerId); } catch (_e) {}
        var pos = mapPointerCoords(ev);
        enqueueInput({
          type: "input_mouse",
          eventType: "mouseReleased",
          x: pos.x,
          y: pos.y,
          button: activeButton,
          clickCount: 1,
          modifiers: modifierMask(ev)
        }, true);
        activeButton = "none";
      }

      canvas.addEventListener("pointerup", finishPointer);
      canvas.addEventListener("pointercancel", finishPointer);

      canvas.addEventListener("wheel", function (ev) {
        if (!state.connected || !state.interactive) return;
        ev.preventDefault();
        var pos = mapPointerCoords(ev);
        enqueueInput({
          type: "input_mouse",
          eventType: "mouseWheel",
          x: pos.x,
          y: pos.y,
          deltaX: Math.round(ev.deltaX),
          deltaY: Math.round(ev.deltaY),
          modifiers: modifierMask(ev)
        }, false);
      }, { passive: false });

      canvas.addEventListener("contextmenu", function (ev) {
        if (state.connected && state.interactive) {
          ev.preventDefault();
        }
      });

      // 键盘与中文 IME 事件绑定
      imeProxy.addEventListener("focus", function () {
        state.keyboardFocused = true;
        renderUiState();
      });

      imeProxy.addEventListener("blur", function () {
        state.keyboardFocused = false;
        renderUiState();
      });

      imeProxy.addEventListener("compositionstart", function () {
        isComposing = true;
      });

      imeProxy.addEventListener("compositionend", function (ev) {
        isComposing = false;
        var text = (ev && typeof ev.data === "string" ? ev.data : "") || imeProxy.value || "";
        imeProxy.value = "";
        if (text) {
          enqueueInput({ type: "input_text", text: text }, true);
        }
      });

      imeProxy.addEventListener("input", function () {
        if (isComposing) return;
        var val = imeProxy.value;
        imeProxy.value = "";
        // 非 keydown 触发的输入（如手机软键盘）直接以文本发送
        if (val && val.length > 1) {
          enqueueInput({ type: "input_text", text: val }, true);
        }
      });

      imeProxy.addEventListener("paste", function (ev) {
        if (!state.connected || !state.interactive) return;
        var text = ev.clipboardData ? ev.clipboardData.getData("text") : "";
        if (text) {
          ev.preventDefault();
          enqueueInput({ type: "input_text", text: text }, true);
        }
      });

      imeProxy.addEventListener("keydown", function (ev) {
        if (!state.connected || !state.interactive) return;
        if (isComposing || ev.isComposing || ev.key === "Process") return;
        var mods = modifierMask(ev);
        // 允许 Ctrl/Cmd+V 触发上面的 paste 事件，不吞掉
        if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "v") {
          return;
        }
        ev.preventDefault();
        var isPrintable = ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey;
        var payload = {
          type: "input_keyboard",
          eventType: "keyDown",
          key: ev.key,
          code: ev.code || "",
          modifiers: mods,
          windowsVirtualKeyCode: ev.keyCode || 0
        };
        if (isPrintable) {
          payload.text = ev.key;
        }
        enqueueInput(payload, true);
      });

      imeProxy.addEventListener("keyup", function (ev) {
        if (!state.connected || !state.interactive) return;
        if (isComposing || ev.isComposing || ev.key === "Process") return;
        enqueueInput({
          type: "input_keyboard",
          eventType: "keyUp",
          key: ev.key,
          code: ev.code || "",
          modifiers: modifierMask(ev),
          windowsVirtualKeyCode: ev.keyCode || 0
        }, false);
      });

      // 工具栏交互
      btnConnect.addEventListener("click", function () {
        if (state.connected) disconnectStream();
        else connectStream();
      });

      btnEmptyConnect.addEventListener("click", connectStream);

      btnInteractive.addEventListener("click", function () {
        state.interactive = !state.interactive;
        renderUiState();
      });

      btnBack.addEventListener("click", function () { runAction("back"); });
      btnForward.addEventListener("click", function () { runAction("forward"); });
      btnReload.addEventListener("click", function () { runAction("reload"); });

      urlForm.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var raw = urlInput.value.trim();
        if (!raw) return;
        runAction("open", { url: raw }).then(function (ok) {
          if (ok && !state.connected) {
            connectStream();
          }
        });
      });

      btnTextbar.addEventListener("click", function () {
        var visible = textBar.classList.toggle("visible");
        if (visible) {
          textBarInput.focus();
        }
      });

      btnTextbarClose.addEventListener("click", function () {
        textBar.classList.remove("visible");
      });

      textBar.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var text = textBarInput.value;
        if (!text) return;
        if (!state.connected || !state.interactive) {
          api.toast("请先连接视口并开启交互", "info");
          return;
        }
        enqueueInput({ type: "input_text", text: text }, true);
        textBarInput.value = "";
      });

      function goBackToChat() {
        if (typeof api.openChat === "function") {
          api.openChat();
        }
      }

      btnBackChat.addEventListener("click", goBackToChat);
      btnEmptyChat.addEventListener("click", goBackToChat);

      btnViewMode.addEventListener("click", function () {
        if (!state.connected) return;
        state.viewMode = state.viewMode === "actual" ? "fit" : "actual";
        renderUiState();
      });

      statusSize.addEventListener("click", function () {
        if (!state.connected) return;
        runAction("sync_viewport", {}).then(function (ok) {
          if (ok) {
            api.toast("已重新同步远程视口分辨率", "ok");
          }
        });
      });

      if (typeof ResizeObserver === "function" && stageEl) {
        var stageResizeObserver = new ResizeObserver(function () {
          fitCanvasToStage();
        });
        stageResizeObserver.observe(stageEl);
      } else {
        window.addEventListener("resize", fitCanvasToStage);
      }

      // 订阅宿主转发的实时流事件
      api.onEvent(function (eventName, payload) {
        if (eventName === "stream.frame") {
          if (!state.connected) {
            state.connected = true;
            syncHeartbeatTimer();
            renderUiState();
          }
          drawFramePayload(payload);
        } else if (eventName === "stream.meta" && payload && typeof payload === "object") {
          if (typeof payload.url === "string") state.url = payload.url;
          if (typeof payload.title === "string") state.title = payload.title;
          if (Array.isArray(payload.tabs)) state.tabs = payload.tabs;
          if (payload.viewport && payload.viewport.width && payload.viewport.height) {
            state.viewportWidth = payload.viewport.width;
            state.viewportHeight = payload.viewport.height;
          }
          renderUiState();
        } else if (eventName === "stream.state" && payload && typeof payload === "object") {
          applySnapshot(payload);
        }
      });

      // 初始化拉取当前状态（若后端已在流式连接中则立即展示最新画面）
      api.fetch("/status?include_frame=1").then(function (res) {
        if (res.ok && res.data) {
          applySnapshot(res.data);
        } else {
          renderUiState();
        }
      }).catch(function () {
        renderUiState();
      });
    })();
  </script>
</body>
</html>
