id: health
name: 运动健康
version: "1.0.0"
description: 只读接入 Intervals.icu（可承接华为运动健康等设备同步）：实时拉取并在本地 SQLite 全量归档每日健康指标（步数、睡眠、静息心率、体重等）与运动记录，读取时自动过滤空值并生成摘要。
author: tentacle
entrypoint: plugin.py:setup
permissions:
  - tools:register
  - fs:plugin_data
  - network:outbound
  - background:task
config_schema:
  api_key_env:
    type: env
    label: Intervals.icu API Key 环境变量
    default: "INTERVALS_API_KEY"
    required: true
    help: 存储 Intervals.icu 个人 API Key 的 .env 环境变量名（在 Intervals.icu 设置底部 Developer Settings 获取）。
  athlete_id:
    type: string
    label: Athlete ID
    default: "0"
    help: 默认 0（自动指代当前 API Key 对应的账户），也可填写形如 i123456 的具体 Athlete ID。
  timezone:
    type: string
    label: 本地时区
    default: "Asia/Shanghai"
    help: 计算“今天”与默认查询日期范围所用的 IANA 时区，例如 Asia/Shanghai。
  proxy:
    type: proxy
    label: HTTP 代理地址
    default: ""
    help: 显式代理地址（如 http://127.0.0.1:7890）；留空直连，不继承环境变量代理。
  sync_interval_minutes:
    type: integer
    label: 后台自动归档间隔（分钟）
    default: 60
    minimum: 0
    maximum: 1440
    help: 定时从 Intervals.icu 拉取近期健康与运动记录并全量归档到本地 SQLite；设为 0 关闭后台定时任务（查询时仍支持实时拉取并归档）。
  sync_lookback_days:
    type: integer
    label: 定时归档回看天数
    default: 7
    minimum: 1
    maximum: 90
    help: 每次后台自动归档向前拉取并更新的天数，避免穿戴设备延迟同步漏数据。
  request_timeout_seconds:
    type: number
    label: API 请求超时（秒）
    default: 15
    minimum: 3
    maximum: 60
    help: 单次访问 Intervals.icu 只读接口的超时时间。
