name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / pytest and ruff
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt

      - name: Install isolated development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev-lock.txt
          .venv/bin/python -m pip check

      - name: Check and build frontend
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run typecheck
          npm --prefix frontend run test
          TENTACLE_OUT_DIR=../web/static npm --prefix frontend run build

      - name: Run ruff and pytest
        env:
          HOME: ${{ runner.temp }}/tentacle-ci-home
          PYTHONNOUSERSITE: '1'
        run: |
          mkdir -p "$HOME"
          .venv/bin/python -m ruff check .
          .venv/bin/python -m pytest

      - name: Build candidate package preview
        run: .venv/bin/python scripts/release_package.py build --candidate "$GITHUB_SHA" --static-dir web/static --output tmp/package-preview

      - name: Save package preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-preview-${{ github.sha }}
          path: tmp/package-preview/*
          if-no-files-found: error
          retention-days: 14

  linux-deployment:
    name: Ubuntu 24.04 / systemd deployment lifecycle
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install, update, recover and revert synthetic releases
        run: |
          for path in /usr/local /usr/local/bin /usr/local/libexec /usr/local/share; do
            if [ -d "$path" ]; then sudo chmod go-w "$path"; fi
          done
          sudo env GITHUB_ACTIONS=true /usr/bin/python3 tests/linux_deployment_smoke.py
