# 工具配置（无 [project]，本项目不做打包）
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# GoalManager 等单例测试需要真实事件循环，警告不阻断
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "web/static",
    "frontend",
    "logs",
    "tmp",
    "data",
    ".venv",
    "skills",
]

[tool.ruff.lint]
# 默认子集：E4/E7/E9（pycodestyle 真 bug 类）+ F（pyflakes 未定义/未使用等）
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402", # run_web.py 的 import tools.* 故意放在 setup_logging() 之后，工具注册时日志须已就绪
    "E731", # lambda 赋值，项目内已有用法
]
